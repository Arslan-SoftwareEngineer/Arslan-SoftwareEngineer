<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 10" width="800" height="10" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E63946" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="70%" stop-color="#E63946" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#F5B301" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="4" width="800" height="2" rx="1" fill="url(#line)"/>

  <circle cy="5" r="5" fill="url(#pulse)">
    <animate attributeName="cx" values="0;800" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
