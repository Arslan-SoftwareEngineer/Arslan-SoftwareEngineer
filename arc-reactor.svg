<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="45%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#F5B301" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F5B301" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- soft outer halo -->
  <circle cx="60" cy="60" r="58" fill="url(#halo)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- outer gold ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#F5B301" stroke-width="2"/>

  <!-- rotating red segmented ring -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#9b2226" stroke-width="7" stroke-dasharray="14 8">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- thin red ring -->
  <circle cx="60" cy="60" r="37" fill="none" stroke="#E63946" stroke-width="1.5"/>

  <!-- counter-rotating gold segments -->
  <circle cx="60" cy="60" r="29" fill="none" stroke="#F5B301" stroke-width="6" stroke-dasharray="7 9">
    <animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- glowing core -->
  <circle cx="60" cy="60" r="19" fill="url(#core)">
    <animate attributeName="r" values="17;21;17" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="7" fill="#fff7d6"/>
</svg>
